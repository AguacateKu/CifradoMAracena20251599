<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashes de instaladores · Práctica de cifrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceff3;
    --panel: #ffffff;
    --ink: #17212b;
    --muted: #5b6875;
    --line: #cfd6de;
    --accent: #2a4bd7;
    --accent-ink: #ffffff;
    --ok: #17794a;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c;
      --panel: #1a222b;
      --ink: #e8edf2;
      --muted: #97a4b2;
      --line: #2e3a46;
      --accent: #7f98ff;
      --accent-ink: #0d1220;
      --ok: #5fd39a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.55;
    padding: 2.5rem 1.25rem 4rem;
  }
  main { max-width: 46rem; margin: 0 auto; }

  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.9rem, 5vw, 2.8rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 0.9rem;
  }
  .intro { color: var(--muted); max-width: 38rem; margin: 0 0 2rem; }

  .picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1.25rem; }
  .picker button {
    font: inherit;
    font-weight: 500;
    color: var(--ink);
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 0.85rem 0.5rem;
    cursor: pointer;
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .picker button:hover { border-color: var(--accent); }
  .picker button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .card {
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 1.5rem 1.4rem 0.6rem;
  }
  .card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin: 0; }
  .file { font-family: var(--mono); font-size: 0.88rem; color: var(--muted); margin: 0.2rem 0 1.2rem; overflow-wrap: anywhere; }

  .hash-row { border-top: 1px solid var(--line); padding: 1rem 0; }
  .hash-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.4rem; }
  .algo { font-weight: 500; }
  .bits { color: var(--muted); font-size: 0.85rem; margin-left: 0.5rem; }
  .copy {
    font: inherit; font-size: 0.85rem;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.25rem 0.7rem;
    cursor: pointer;
  }
  .copy:hover { border-color: var(--accent); }
  .copy.done { color: var(--ok); border-color: var(--ok); }
  .hash {
    font-family: var(--mono);
    font-size: 0.92rem;
    overflow-wrap: anywhere;
    word-break: break-all;
    margin: 0;
    user-select: all;
  }
  .source { margin: 1rem 0 0.6rem; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 1rem; overflow-wrap: anywhere; }
  .source a { color: var(--accent); }

  footer { margin-top: 2rem; font-size: 0.85rem; color: var(--muted); }

  @media (max-width: 480px) {
    .picker { grid-template-columns: 1fr; }
    .card { padding: 1.2rem 1rem 0.4rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Huellas digitales de tres instaladores</h1>
  <p class="intro">Elige una aplicación para ver sus valores MD5, SHA1 y SHA256. Compáralos con los de tu descarga para confirmar que el archivo no fue alterado.</p>

  <div class="picker" id="picker" role="group" aria-label="Aplicaciones"></div>

  <section class="card" id="card" aria-live="polite"></section>

  <footer>Práctica de cifrado · Servido por HTTPS desde maracena20251599.duckdns.org</footer>
</main>

<script>
  var apps = {
    plink: {
      nombre: "plink.exe",
      archivo: "plink.exe",
      url: "https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe",
      md5: "63680900b42bf3f41f71c3a4cff80e15",
      sha1: "00aab5b2cee16db15081936fc17b53735bdad127",
      sha256: "969f36879d5716aa1a9811f43a6a6510e8f08372dbeb9695b810b9c776f39c75"
    },
    putty: {
      nombre: "putty.exe",
      archivo: "putty.exe",
      url: "https://the.earth.li/~sgtatham/putty/latest/w64/putty.exe",
      md5: "0673fca154b47e4158269b4eadd23689",
      sha1: "0456c056dfb21549163a48c2e9b10dd572c9924f",
      sha256: "d01fdb5aae8f112526040a39b0bfb9e27d813003178645e65f8d1cfdb2a26c87"
    },
    virtualbox: {
      nombre: "VirtualBox 7.0.8",
      archivo: "VirtualBox-7.0.8-156879-Win.exe",
      url: "https://download.virtualbox.org/virtualbox/7.0.8/VirtualBox-7.0.8-156879-Win.exe",
      md5: "5277068968032af616e7e4cc86f1d3c2",
      sha1: "6e3e2912d2131bb249f416088ee49088ab841580",
      sha256: "8a2da26ca69c1ddfc50fb65ee4fa8f269e692302046df4e2f48948775ba6339a"
    }
  };

  var algos = [
    { clave: "md5", etiqueta: "MD5", bits: "128 bits" },
    { clave: "sha1", etiqueta: "SHA1", bits: "160 bits" },
    { clave: "sha256", etiqueta: "SHA256", bits: "256 bits" }
  ];

  var picker = document.getElementById("picker");
  var card = document.getElementById("card");

  function copiar(texto, boton) {
    function listo() {
      boton.textContent = "Copiado";
      boton.classList.add("done");
      setTimeout(function () {
        boton.textContent = "Copiar";
        boton.classList.remove("done");
      }, 1500);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(texto).then(listo);
    } else {
      var t = document.createElement("textarea");
      t.value = texto;
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      document.body.removeChild(t);
      listo();
    }
  }

  function mostrar(id) {
    var app = apps[id];
    var botones = picker.querySelectorAll("button");
    for (var i = 0; i < botones.length; i++) {
      botones[i].setAttribute("aria-pressed", botones[i].dataset.id === id ? "true" : "false");
    }
    card.innerHTML = "";

    var h2 = document.createElement("h2");
    h2.textContent = app.nombre;
    card.appendChild(h2);

    var file = document.createElement("p");
    file.className = "file";
    file.textContent = app.archivo;
    card.appendChild(file);

    algos.forEach(function (a) {
      var fila = document.createElement("div");
      fila.className = "hash-row";

      var cab = document.createElement("div");
      cab.className = "hash-head";

      var titulo = document.createElement("div");
      var nombre = document.createElement("span");
      nombre.className = "algo";
      nombre.textContent = a.etiqueta;
      var bits = document.createElement("span");
      bits.className = "bits";
      bits.textContent = a.bits;
      titulo.appendChild(nombre);
      titulo.appendChild(bits);

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "copy";
      btn.textContent = "Copiar";
      btn.setAttribute("aria-label", "Copiar " + a.etiqueta + " de " + app.nombre);
      btn.addEventListener("click", function () { copiar(app[a.clave], btn); });

      cab.appendChild(titulo);
      cab.appendChild(btn);

      var valor = document.createElement("p");
      valor.className = "hash";
      valor.textContent = app[a.clave];

      fila.appendChild(cab);
      fila.appendChild(valor);
      card.appendChild(fila);
    });

    var origen = document.createElement("p");
    origen.className = "source";
    origen.appendChild(document.createTextNode("Descarga original: "));
    var enlace = document.createElement("a");
    enlace.href = app.url;
    enlace.textContent = app.url;
    enlace.rel = "noopener";
    origen.appendChild(enlace);
    card.appendChild(origen);
  }

  Object.keys(apps).forEach(function (id) {
    var b = document.createElement("button");
    b.type = "button";
    b.dataset.id = id;
    b.textContent = apps[id].nombre;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { mostrar(id); });
    picker.appendChild(b);
  });

  mostrar("plink");
</script>
</body>
</html>
